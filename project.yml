name: BusLinkNative
options:
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    IPHONEOS_DEPLOYMENT_TARGET: '17.0'
    TARGETED_DEVICE_FAMILY: '1'
targets:
  BusLinkNative:
    type: application
    platform: iOS
    sources:
      - Sources
      - Assets.xcassets
    dependencies:
      - target: BusLinkWidgetExtension
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: studio.mikegyver.buslinknative
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: BusLink
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: 1.2.0
        CURRENT_PROJECT_VERSION: 3
  BusLinkWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - BusLinkWidget
    info:
      path: BusLinkWidget/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: studio.mikegyver.buslinknative.widget
        SKIP_INSTALL: YES
        MARKETING_VERSION: 1.2.0
        CURRENT_PROJECT_VERSION: 3
    dependencies:
      - sdk: SwiftUI.framework
      - sdk: WidgetKit.framework
